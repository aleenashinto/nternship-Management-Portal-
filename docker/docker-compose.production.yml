version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: internship_portal
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  portal:
    build:
      context: ../portal
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres
      - redis
      - mailhog
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@postgres:5432/internship_portal?schema=public"
      REDIS_URL: "redis://redis:6379/0"
      SESSION_SECRET: "production-session-secret-change-me-at-least-32-chars"
      APP_URL: "http://localhost:3000"
      STORAGE_DIR: "/app/storage"
      SMTP_HOST: "mailhog"
      SMTP_PORT: "1025"
    ports:
      - "3000:3000"
    volumes:
      - portal_storage:/app/storage

volumes:
  pgdata:
  portal_storage:
